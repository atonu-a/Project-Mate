<!-- Modals -->
<!-- Project Delete Modal -->
<section id="delete-modal-{{ project.slug }}" class="modal">
    <div class="modal-content relative">
        <a class="cross absolute top-2 right-2 cursor-pointer" onclick="closeModal('{{ project.slug }}')"><i
                class="fa-solid fa-xmark"></i></a>

        <h1 class="header">Confirmation</h1>
        <p class="msg text-danger">Are you sure you want to delete this project?</p>
        <div class="btns">
            <a class="btn-cancel" onclick="closeModal('{{ project.slug }}')">Cancel</a>
            <form method="post" action="{% url 'delete_project' project.slug %}">
                {% csrf_token %}
                <button type="submit" class="btn-danger">Delete</button>
            </form>
            
        </div>
    </div>
</section>


<!-- Sending Message During Join Request Modal -->
<section id="send-msg-modal-{{ project.slug }}" class="modal">
    <div class="modal-content relative">
        <a class="cross absolute top-2 right-2 cursor-pointer" onclick="closeMsgModal('{{ project.slug }}')"><i
                class="fa-solid fa-xmark"></i></a>
        <h1 class="header">Want to Send Message?</h1>

        <div class="chat__composer msg">
            <form method="post" action="{% url 'send_request' project.slug %}" class="chat__form">
                {% csrf_token %}
                <textarea required type="text" placeholder="Type a message to your teammate..." class="chat__input"
                    aria-label="Message" name="msg"></textarea>
                <button type="submit" id="send-msg" class="mobile-menu__link-icon"><i data-lucide="send-horizontal"
                        class=""></i></button>
            </form>
        </div>
        <div class="btns">
            <form action="{% url 'send_request' project.slug %}" method="post">
                {% csrf_token %}
                <input type="hidden" value="" />
                <button type="submit" class="btn-secondary">Request Without Message</button>
            </form>
        </div>
    </div>
</section>


<!-- Project Leave Modal -->
<section id="leave-modal-{{ project.slug }}" class="modal">
    <div class="modal-content relative">
        <a class="cross absolute top-2 right-2 cursor-pointer" onclick="closeLeaveModal('{{ project.slug }}')"><i
                class="fa-solid fa-xmark"></i></a>

        <h1 class="header">Confirmation</h1>
        <p class="msg text-danger">Are you sure you want to leave this project?</p>
        <div class="btns">
            <a class="btn-cancel" onclick="closeLeaveModal('{{ project.slug }}')">Cancel</a>
            <form method="post" action="{% url 'leave' project.slug %}">
                {% csrf_token %}
                <button type="submit" class="btn-danger">Leave</button>
            </form>
            
        </div>
    </div>
</section>
