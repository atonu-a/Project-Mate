<!-- Delete confirmation modal -->
<div id="deleteModal" class="modal-backdrop" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
        <h3 id="modalTitle">Delete your account?</h3>
        <p>All your projects, messages and profile data will be removed permanently.</p>

        <form method="post" action="">
            {% csrf_token %}
            <label for="deleteConfirmInput" class="form-label">Type DELETE to confirm</label>
            <input id="deleteConfirmInput" type="text" autocomplete="off" class="form-input"
                oninput="checkDeleteInput()">

            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button type="submit" id="deleteConfirmBtn" class="btn-danger" disabled>Delete account</button>
            </div>
        </form>
    </div>
</div>
