{% extends "base.html" %}
{% block main %}
<main class="page-main page-main--wide">
    <div class="page-header">
        <div>
            <h1 class="page-title">My Projects &amp; Collaborations</h1>
            <p class="page-subtitle">Manage projects you own and team contributions you are actively participating in.
            </p>
        </div>
        <button onclick="window.location.href='{% url 'create' %}'" class="page-header__action">
            <i data-lucide="plus" class="btn-icon"></i>
            <span>New Project</span>
        </button>
    </div>

    <div class="project-grid">
        {% for project in projects %}
        <article class="project-card">
            <div class="project-card__body">
                <div class="project-card__meta">
                    <span class="role-tag">Owner</span>
                    <span class="sprint-status"><i data-lucide="activity" class="sprint-status__icon"></i>Sprint 2
                        Active</span>
                </div>
                <h3 onclick="window.location.href='{% url 'project_detail' project.slug %}'" class="project-card__title">
                    {{project.title}}</h3>
                <p class="project-card__text">{{project.desc}}</p>
            </div>
            <div class="project-card__footer">
                <span class="project-card__team"> Members in Team</span>
                <button onclick="window.location.href='{% url 'messages' %}'" class="btn-tonal">
                    <i data-lucide="message-square" class="btn-tonal__icon"></i>
                    <span>Team Chat</span>
                </button>
            </div>
        </article>
        {% endfor %}

    </div>
</main>

{% endblock main %}
