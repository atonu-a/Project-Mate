{% extends "base.html" %}


{% block header %}
{% endblock header %}
{% block sidebar %}
{% endblock sidebar %}

{% block main %}
    <main class="auth-main">
        <div class="auth-wrap">
            <div class="auth-card">
                <div class="auth-card__head">
                    <h1 class="auth-title">Welcome back</h1>
                    <p class="auth-subtitle">Sign in to find your next collaborator or project.</p>
                </div>

                <form onsubmit="event.preventDefault(); showToast('Signed in successfully!'); setTimeout(()=>window.location.href='index.html', 1200);" class="form">
                    <div class="form-field">
                        <label for="signinEmail" class="form-label">Email</label>
                        <input id="signinEmail" type="email" required autocomplete="email" placeholder="you@example.com" class="form-input">
                    </div>

                    <div class="form-field">
                        <label for="signinPassword" class="form-label">Password</label>
                        <div class="form-input-group">
                            <input id="signinPassword" type="password" required autocomplete="current-password" placeholder="Enter your password" class="form-input">
                            <button type="button" onclick="togglePasswordVisibility(this)" class="form-input-group__toggle" aria-label="Show password">
                                <i data-lucide="eye" class="form-input-group__toggle-icon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-check-row">
                        <label class="form-check">
                            <input type="checkbox" class="form-check__input">
                            <span>Remember me</span>
                        </label>
                        <a href="#" onclick="showToast('Password reset link sent!', 'info'); return false;" class="auth-forgot">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-primary btn-loading">Sign In</button>
                </form>

                <div class="auth-divider">or</div>

                <button type="button" onclick="showToast('Google sign-in coming soon', 'info')" class="btn-secondary">
                    <i data-lucide="chrome" class="btn-icon"></i>
                    <span><i class="fa-brands fa-google"></i> Continue with Google</span>
                </button>
            </div>

            <p class="auth-footer">Don't have an account? <a href="{% url 'signup' %}" class="auth-footer__link">Sign up</a></p>
        </div>
    </main>

{% endblock main %}
