{% extends "base.html" %}
{% block main %}
    <main class="page-main page-main--narrow">
        <div class="page-header">
            <div>
                <h1 class="page-title">Notifications</h1>
                <p class="page-subtitle">Stay updated on join requests, project milestones, and team messages.</p>
            </div>
        </div>

        <div class="notice-list">
            {% for notice in notifications %}
            <div class="notice cursor-pointer" onclick="window.location.href='{{ notice.target_url }}'">
                <div class="notice__body">
                    <div class="notice__icon notice__icon--success">
                        <i data-lucide="check-circle-2" class="notice__glyph"></i>
                    </div>
                    <div>
                        <h4 class="notice__title">{{ notice.get_notification_type_display }}</h4>
                        <p class="notice__text">{{ notice.content }}</p>
                    </div>
                </div>
                <span class="notice__time">1 hour ago</span>
            </div>
            {% endfor %}
            <!-- <div class="notice">
                <div class="notice__body">
                    <div class="notice__icon">
                        <i data-lucide="bell" class="notice__glyph"></i>
                    </div>
                    <div>
                        <h4 class="notice__title">New Teammate Applied</h4>
                        <p class="notice__text">Devon Miles requested to join NeuralSync as Frontend Dev.</p>
                    </div>
                </div>
                <span class="notice__time">3 hours ago</span>
            </div> -->
        </div>
    </main>

{% endblock main %}
