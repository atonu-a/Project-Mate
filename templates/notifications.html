<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectPartner — Notifications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="site-header">
        <div class="site-header__inner">
            <div class="brand" onclick="window.location.href='index.html'">
                <div class="brand__logo">
                    <i data-lucide="layers" class="brand__logo-icon"></i>
                </div>
                <span class="brand__name">ProjectPartner</span>
            </div>
            <div class="header-actions">
                <button onclick="toggleTheme()" class="icon-button" aria-label="Toggle theme">
                    <i data-lucide="sun" class="theme-icon-sun"></i>
                    <i data-lucide="moon" class="theme-icon-moon"></i>
                </button>
                <button onclick="window.location.href='index.html'" class="header-link">Dashboard</button>
            </div>
        </div>
    </header>

    <main class="page-main page-main--narrow">
        <div class="page-header">
            <div>
                <h1 class="page-title">Notifications</h1>
                <p class="page-subtitle">Stay updated on join requests, project milestones, and team messages.</p>
            </div>
        </div>

        <div class="notice-list">
            <div class="notice">
                <div class="notice__body">
                    <div class="notice__icon notice__icon--success">
                        <i data-lucide="check-circle-2" class="notice__glyph"></i>
                    </div>
                    <div>
                        <h4 class="notice__title">Join Request Accepted</h4>
                        <p class="notice__text">Dmitri Volkov accepted your request to join QuantumPay.</p>
                    </div>
                </div>
                <span class="notice__time">1 hour ago</span>
            </div>

            <div class="notice">
                <div class="notice__body">
                    <div class="notice__icon">
                        <i data-lucide="bell" class="notice__glyph"></i>
                    </div>
                    <div>
                        <h4 class="notice__title">New Teammate Applied</h4>
                        <p class="notice__text">Devon Miles requested to join NeuralSync as Frontend Dev.</p>
                    </div>
                </div>
                <span class="notice__time">3 hours ago</span>
            </div>
        </div>
    </main>

    <div id="toastContainer" class="toast-container"></div>
    <script src="js/app.js"></script>
</body>
</html>
