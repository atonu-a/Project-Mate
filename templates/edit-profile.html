{% extends "base.html" %}

{% block main %}

<main class="page-main page-main--narrow">
    <div class="form-panel">
        <!-- header  -->
        <header>
            <div class="eyebrow">
                <i data-lucide="pencil" class="eyebrow__icon"></i>
                <span>Edit Profile</span>
            </div>

            <h1 class="page-title">Update your details</h1>
            <p class="page-subtitle">
                Keep your profile current so the right people can find you.
            </p>
        </header>

        <form method="post" class="form" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Profile Photo -->
            <div class="avatar-upload">
                <div class="avatar-upload__frame">
                    <img id="editAvatarPreview" src="{{ profile.profile_pic_url }}" alt="Profile photo preview"
                        class="avatar-upload__preview"
                        style="object-fit: cover; object-position: {{ profile.avatar_position|default:'50% 50%' }}; cursor: grab;">
            
                    <label for="editAvatarInput" class="avatar-upload__edit" aria-label="Change profile photo">
                        <i data-lucide="camera" class="avatar-upload__edit-icon"></i>
                    </label>
            
                    <input id="editAvatarInput" type="file" accept="image/*" onchange="previewAvatar(this, 'editAvatarPreview')"
                        class="avatar-upload__input" name="profile_pic">
            
                    <!-- Hidden Input to save alignment -->
                    <input type="hidden" id="editAvatarPosition" name="avatar_position"
                        value="{{ profile.avatar_position|default:'50% 50%' }}">
                </div>

            </div>
            
            <!-- Cover Photo -->
            <div class="avatar-upload cover-upload">
                <div class="avatar-upload__frame public-profile__hero-cover_img">
                    <img id="editCoverPreview" src="{{profile.cover_pic.url }}" alt="Cover photo preview"
                        class="public-profile__hero-cover_img cover-upload__preview"
                        style="object-fit: cover; object-position: {{ profile.cover_position|default:'50% 50%' }}; cursor: grab;">
            
                    <label for="editCoverInput" class="avatar-upload__edit" aria-label="Change cover photo">
                        <i data-lucide="camera" class="avatar-upload__edit-icon"></i>
                    </label>
            
                    <input id="editCoverInput" type="file" accept="image/*" onchange="previewAvatar(this, 'editCoverPreview')"
                        class="avatar-upload__input" name="cover_pic">
            
                    <!-- Hidden Input to save alignment -->
                    <input type="hidden" id="editCoverPosition" name="cover_position"
                        value="{{ profile.cover_position|default:'50% 50%' }}">
                </div>
            </div>

            <!-- Full Name -->
            <div class="form-field">

                <label for="editName" class="form-label">
                    Full Name<span class="text-danger">*</span>
                </label>

                <input id="editName" type="text" required class="form-input" name="full_name"
                    value="{{ request.user.first_name }} {{ request.user.last_name }}">

            </div>


            <!-- Headline -->
            <div class="form-field">

                <label for="editHeadline" class="form-label">
                    Headline<span class="text-danger">*</span>
                </label>

                <input id="editHeadline" type="text" required name="headline" value="{{ profile.headline }}"
                    class="form-input">

                <p class="form-hint">
                    One line describing what you do — technical or not.
                </p>

            </div>


            <!-- Fields -->
            <div class="form-section">

                <span class="form-section__title">
                    What field are you in?<span class="text-danger">*</span>
                </span>

                <span class="form-section__hint">
                    Select all that apply.
                </span>


                <div class="field-chip-group">

                    <button type="button" onclick="toggleFieldChip(this)" data-value="Technology & Development"
                        class="field-chip {% if 'Technology & Development' in selected_fields %}is-selected{% endif %}">
                        Technology &amp; Development
                    </button>

                    <button type="button" onclick="toggleFieldChip(this)" data-value="Design & Creative"
                        class="field-chip {% if 'Design & Creative' in selected_fields %}is-selected{% endif %}">
                        Design &amp; Creative
                    </button>

                    <button type="button" onclick="toggleFieldChip(this)" data-value="Marketing & Sales"
                        class="field-chip {% if 'Marketing & Sales' in selected_fields %}is-selected{% endif %}">
                        Marketing &amp; Sales
                    </button>

                    <button type="button" onclick="toggleFieldChip(this)" data-value="Business & Operations"
                        class="field-chip {% if 'Business & Operations' in selected_fields %}is-selected{% endif %}">
                        Business &amp; Operations
                    </button>

                    <button type="button" onclick="toggleFieldChip(this)" data-value="Writing & Content"
                        class="field-chip {% if 'Writing & Content' in selected_fields %}is-selected{% endif %}">
                        Writing &amp; Content
                    </button>

                    <button type="button" onclick="toggleFieldChip(this)" data-value="Education & Training"
                        class="field-chip {% if 'Education & Training' in selected_fields %}is-selected{% endif %}">
                        Education &amp; Training
                    </button>

                    <button type="button" onclick="toggleFieldChip(this)" data-value="Healthcare"
                        class="field-chip {% if 'Healthcare' in selected_fields %}is-selected{% endif %}">
                        Healthcare
                    </button>

                    <button type="button" onclick="toggleFieldChip(this)" data-value="Finance"
                        class="field-chip {% if 'Finance' in selected_fields %}is-selected{% endif %}">
                        Finance
                    </button>

                    <button type="button" onclick="toggleFieldChip(this)" data-value="Student"
                        class="field-chip {% if 'Student' in selected_fields %}is-selected{% endif %}">
                        Student
                    </button>

                    <button type="button" onclick="toggleFieldChip(this)" data-value="Other"
                        class="field-chip {% if 'Other' in selected_fields %}is-selected{% endif %}">
                        Other
                    </button>

                </div>

                <input type="hidden" name="fields" id="selectedFields">


                <input type="hidden" name="fields" id="selectedFields">

            </div>


            <!-- Skills -->
            <div class="form-field">

                <label for="editSkills" class="form-label">
                    Skills &amp; Interests (comma separated)
                </label>

                <input id="editSkills" type="text" name="skills"
                    value="{% for skill in profile.skills.all %}{{ skill.name }}{% if not forloop.last %}, {% endif %}{% endfor %}"
                    class="form-input" placeholder="e.g., Python, Django, React, Git...">

            </div>


            <!-- Location & Institute -->
            <div class="form-row">

                <div class="form-field">

                    <label for="editLocation" class="form-label">
                        Location
                    </label>

                    <input id="editLocation" type="text" name="location" value="{{ profile.location|default:'Remote' }}"
                        placeholder="City, Country (or Remote)" class="form-input">

                </div>

                <div class="form-field">

                    <label for="editLocation" class="form-label">
                        Organization / Institute
                    </label>

                    <input id="editLocation" type="text" name="institute"
                        value="{{ profile.institute|default:'Independent' }}" placeholder="e.g. ABC Company Ltd."
                        class="form-input">

                </div>




            </div>
            <!-- URL & Github -->
            <div class="form-row">

                <div class="form-field">

                    <label for="editLink" class="form-label">
                        Portfolio / Profile Link
                    </label>

                    <input id="editLink" type="url" name="url" value="{{ profile.url|default:'' }}"
                        placeholder="https://..." class="form-input">

                </div>


                <div class="form-field">

                    <label for="editLink" class="form-label">
                        GitHub Link
                    </label>

                    <input id="editLink" type="url" name="github" value="{{ profile.github|default:'' }}"
                        placeholder="https://..." class="form-input">

                </div>

            </div>
            <!-- Whatsapp and Linkedin -->
            <div class="form-row">

                <div class="form-field">

                    <label for="editLink" class="form-label">
                        Whatsapp NO<span class="text-danger">*</span>
                    </label>

                    <input id="editLink" type="text" name="whatsapp" value="{{ profile.whatsapp}}"
                        placeholder="+880........" class="form-input" required>

                </div>


                <div class="form-field">

                    <label for="editLink" class="form-label">
                        Linkedin URL
                    </label>

                    <input id="editLink" type="url" name="linkedin" value="{{profile.linkedin}}"
                        placeholder="https://..." class="form-input">

                </div>

            </div>


            <!-- Bio -->
            <div class="form-field">

                <label for="editBio" class="form-label">
                    Short Bio
                </label>

                <textarea id="editBio" name="bio" rows="4" class="form-input"
                    placeholder="Tell teammates what you're looking for and what you can offer, in plain language.">{{ profile.bio }}</textarea>

            </div>


            <!-- Actions -->
            <div class="form-actions">

                <button type="button" onclick="window.location.href='{% url 'profile' request.user.username%}'"
                    class="form-cancel">
                    Cancel
                </button>

                <button type="submit" class="form-submit btn-loading" data-text="Saving...">
                    Save Changes
                </button>

            </div>

        </form>

    </div>


    <!-- Crop Modal -->
    <div id="cropModal"
        style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.8); align-items:center; justify-content:center;">
        <div style="background:#fff; padding:20px; border-radius:8px; max-width:90%; width:500px; text-align:center;">
            <h3>Adjust / Crop Image</h3>
            <div style="max-height: 400px; margin: 15px 0; overflow: hidden;">
                <img id="imageToCrop" src="" style="max-width: 100%; display: block;">
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button type="button" id="cancelCropBtn"
                    style="padding:8px 16px; background:#ccc; border:none; border-radius:4px; cursor:pointer;">Cancel</button>
                <button type="button" id="applyCropBtn"
                    style="padding:8px 16px; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer;">Done</button>
            </div>
        </div>
    </div>

</main>

<script>

    function updateSelectedFields() {

        const selectedFields = [];

        document.querySelectorAll(".field-chip.is-selected").forEach(chip => {
            selectedFields.push(chip.dataset.value);
        });

        document.getElementById("selectedFields").value =
            selectedFields.join(",");
    }


    function toggleFieldChip(button) {

        button.classList.toggle("is-selected");

        updateSelectedFields();
    }


    document.addEventListener("DOMContentLoaded", function () {

        updateSelectedFields();

    });

</script>

{% endblock main %}
