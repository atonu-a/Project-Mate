{% extends 'base.html' %}
{% block main %}
  <!-- Centre column: one post per row -->
  <main class="feed" id="socialFeedContainer">
    <!-- Filter bar -->
    <div class="feed-toolbar">
      <div class="feed-tabs">
        <a href="?feed=all" class="feed-tab {% if feed == 'all' %}
        is-active
        {% else %}
        {% endif %} ">All Projects</a href="">
        <a href="?feed=following" class="feed-tab {% if feed == 'following' %}
        is-active
        {% else %}
        {% endif %}">Following</a href="">
        <!-- <a href="?ai_matched" class="feed-tab">AI Matched</a href=""> -->
      </div>
      <button onclick="window.location.href='{% url 'create' %}'" class="feed-post-btn"><i data-lucide="plus" class="feed-post-btn__icon"></i><span>Post</span></button>
    </div>

    <!-- Posts -->
     {% include "posts.html" %}

    <!-- Infinite-scroll indicator -->
    <div id="infiniteLoader" class="feed-loader">
      <div class="feed-loader__spinner"></div>
      <p class="feed-loader__text">Loading more project opportunities...</p>
    </div>
  </main>

  <!-- Right column: suggested teammates (wide desktop) -->
  <aside class="feed-aside">
    <div class="suggest-panel">
      <h3 class="suggest-panel__title">Suggested Teammates</h3>
      <div class="suggest-panel__list">
        {% for teammates in suggested_users %}
        
        
        <div class="suggest-row">
          <div class="suggest-row__person cursor-pointer" onclick="location.href='{% url 'profile' teammates.username %}'">
            <img src="{{ teammates.profile.profile_pic_url }}" alt="{{ teammates.username }}" class="suggest-row__avatar" />
            <div>
              <h4 class="suggest-row__name">{{ teammates.first_name }} {{ teammates.last_name }}</h4>
              <p class="suggest-row__role">Rust Engineer</p>
            </div>
          </div>
          <button onclick="showToast('Connection request sent!')" class="suggest-row__add" aria-label="Send connection request"><i data-lucide="user-plus" class="suggest-row__add-icon"></i></button>
        </div>
        {% endfor %}

      </div>
    </div>
  </aside>
{% endblock %}
