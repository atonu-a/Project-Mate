{% extends "base.html" %}
{% block main %}
<main class="page-main page-main--narrow">
    <div class="form-panel">
        <header>
            <div class="eyebrow">
                <i data-lucide="plus-circle" class="eyebrow__icon"></i>
                <span>Project Studio</span>
            </div>
            <h1 class="page-title">Create a New Project</h1>
            <p class="page-subtitle">Pitch your idea, specify required tech stacks, and start building your dream team.
            </p>
        </header>

        <form
            onsubmit="event.preventDefault(); showToast('Project published successfully!'); setTimeout(()=>window.location.href='{% url 'home' %}', 1500);"
            class="form">
            <div class="form-field">
                <label for="projectTitle" class="form-label">Project Title</label>
                <input id="projectTitle" type="text" required placeholder="e.g., Quantum Compiler for Neural Networks"
                    class="form-input">
            </div>

            <div class="form-field">
                <label for="projectTagline" class="form-label">Short Tagline</label>
                <input id="projectTagline" type="text" required
                    placeholder="One sentence description of what your project achieves..." class="form-input">
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label for="projectCategory" class="form-label">Category</label>
                    <select id="projectCategory" class="form-input">
                        <option>AI &amp; Machine Learning</option>
                        <option>Web3 &amp; FinTech</option>
                        <option>CleanTech &amp; Mobile</option>
                        <option>Healthcare &amp; IoT</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="projectTeamSize" class="form-label">Max Team Size</label>
                    <input id="projectTeamSize" type="number" min="2" max="10" value="4" class="form-input">
                </div>
            </div>

            <div class="form-field">
                <label for="projectSkills" class="form-label">Required Skills (Comma separated)</label>
                <input id="projectSkills" type="text" placeholder="Python, React, PyTorch, Tailwind..."
                    class="form-input">
            </div>

            <div class="form-field">
                <label for="projectDescription" class="form-label">Full Description</label>
                <textarea id="projectDescription" rows="5"
                    placeholder="Detail your architecture, milestones, and what kind of teammates you are looking for..."
                    class="form-input"></textarea>
            </div>

            <div class="form-actions">
                <button type="button" onclick="window.location.href='{% url 'dashboard' %}'"
                    class="form-cancel">Cancel</button>
                <button type="submit" class="form-submit">Publish Project</button>
            </div>
        </form>
    </div>
</main>

{% endblock main %}
